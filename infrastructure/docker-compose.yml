services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
      
  rag-api:
    build:
      context: ..
      dockerfile: infrastructure/api/Dockerfile
    container_name: rag-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      Ollama__BaseUrl: http://ollama:11434
      Ollama__EmbeddingModel: nomic-embed-text
      Ollama__ChatModel: phi3
      Qdrant__BaseUrl: http://qdrant:6333
      Qdrant__CollectionName: ragdemo-documents
    depends_on:
      - ollama
      - qdrant

volumes:
  ollama-data:
  qdrant-data: